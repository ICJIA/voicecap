<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask a question | Voicecap Test Agency</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        color: #1b1b1b;
        background: #ffffff;
      }
      header,
      main,
      footer {
        padding: 0.5rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <!--
      Forms fixture: no feedback. The fields are labeled and marked required, but a broken script
      stops every press and does nothing else: no message, no field marked invalid, no request, and
      focus stays on the button. Expected: can't be completed ("pressing submit changed nothing"),
      with form-no-feedback and form-cant-finish: "This form can't be completed with NVDA."
    -->
    <header>
      <a href="/">Voicecap Test Agency</a>
    </header>
    <main id="main">
      <h1>Ask a question</h1>
      <form id="question" action="/forms/no-feedback/sent/" method="post" novalidate>
        <p>
          <label for="asker">Your name</label>
          <input id="asker" name="asker" aria-required="true" />
        </p>
        <p>
          <label for="question-text">Your question</label>
          <textarea id="question-text" name="question-text" aria-required="true"></textarea>
        </p>
        <p><button type="submit">Ask</button></p>
      </form>
    </main>
    <footer>
      <p>© 2026 Voicecap Test Agency</p>
    </footer>
    <script>
      document.getElementById("question").addEventListener("submit", (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
