<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-label="How voicecap works, in six steps: every page on the list; the real screen reader; three ways through a page; every word, checked; a person reviews; a sealed record. Below them, three lines NVDA said on voicecap's demo site.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#181F3A"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2649"/>
      <stop offset="1" stop-color="#141A34"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="768" rx="20" fill="url(#bg)"/>


  <text x="66" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#6E7AA0">HOW VOICECAP WORKS</text>
  <text x="64" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#F4F2EC">A human review, sped up</text>
  <rect x="66" y="144" width="66" height="5" rx="2.5" fill="#F4B53F"/>
  <text x="65" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#BBC2D8">voicecap presses the screen reader's keys and turns the pages. A person reads and fixes.</text>

  <g>
    <rect x="64" y="200" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="88" y="224" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(100 236)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
    <text x="152" y="254" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">01</text>
    <text x="88" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">Every page on the list</text>
    <text x="88" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">From a sitemap, or a CSV of chosen</text>
    <text x="88" y="357" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">pages. Each is read once, in full:</text>
    <text x="88" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">none missed or done twice.</text>
  </g>

  <g>
    <rect x="429.3333333333333" y="200" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="453.3333333333333" y="224" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(465.3333333333333 236)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></g>
    <text x="517.3333333333333" y="254" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">02</text>
    <text x="453.3333333333333" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">The real screen reader</text>
    <text x="453.3333333333333" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">voicecap runs NVDA itself, never a</text>
    <text x="453.3333333333333" y="357" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">simulation, with a fresh browser</text>
    <text x="453.3333333333333" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">for every page.</text>
  </g>

  <g>
    <rect x="794.6666666666666" y="200" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="818.6666666666666" y="224" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(830.6666666666666 236)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></g>
    <text x="882.6666666666666" y="254" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">03</text>
    <text x="818.6666666666666" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">Three ways through a page</text>
    <text x="818.6666666666666" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">Down Arrow line by line, H heading</text>
    <text x="818.6666666666666" y="357" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">by heading, Tab control by control,</text>
    <text x="818.6666666666666" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">as a person presses them.</text>
  </g>

  <g>
    <rect x="64" y="416" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="88" y="440" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(100 452)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></g>
    <text x="152" y="470" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">04</text>
    <text x="88" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">Every word, checked</text>
    <text x="88" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">Each key press and all NVDA said,</text>
    <text x="88" y="573" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">in order. If another window takes</text>
    <text x="88" y="596" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">the screen, the step is thrown out.</text>
  </g>

  <g>
    <rect x="429.3333333333333" y="416" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="453.3333333333333" y="440" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(465.3333333333333 452)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></g>
    <text x="517.3333333333333" y="470" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">05</text>
    <text x="453.3333333333333" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">A person reviews</text>
    <text x="453.3333333333333" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">The person running voicecap reads</text>
    <text x="453.3333333333333" y="573" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">the transcripts, records what they</text>
    <text x="453.3333333333333" y="596" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">found, and fixes it.</text>
  </g>

  <g>
    <rect x="794.6666666666666" y="416" width="341.3333333333333" height="196" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="818.6666666666666" y="440" width="48" height="48" rx="12" fill="#F4B53F" fill-opacity="0.14"/>
    <g transform="translate(830.6666666666666 452)" fill="none" stroke="#F4B53F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
    <text x="882.6666666666666" y="470" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#F4B53F">06</text>
    <text x="818.6666666666666" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4F2EC">A sealed record</text>
    <text x="818.6666666666666" y="550" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">Every file gets a fingerprint, and</text>
    <text x="818.6666666666666" y="573" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">each run is sealed: voicecap verify</text>
    <text x="818.6666666666666" y="596" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#BBC2D8">shows that nothing has changed.</text>
  </g>

  <text x="66" y="652" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#6E7AA0">WHAT NVDA SAID ON THE DEMO SITE'S HOME PAGE</text>

  <g>
    <rect x="64" y="670" width="341.3333333333333" height="66" rx="12" fill="#151C39" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="80" y="687" width="36" height="30" rx="6" fill="#1E2649" stroke="#2F3A64" stroke-width="1.5"/>
    <text x="98" y="707" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#F4B53F">↓</text>
    <text x="132" y="708" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#D9DEEE">“banner landmark, voicecap demo”</text>
  </g>

  <g>
    <rect x="429.3333333333333" y="670" width="341.3333333333333" height="66" rx="12" fill="#151C39" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="445.3333333333333" y="687" width="36" height="30" rx="6" fill="#1E2649" stroke="#2F3A64" stroke-width="1.5"/>
    <text x="463.3333333333333" y="707" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#F4B53F">H</text>
    <text x="497.3333333333333" y="698" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#D9DEEE">“main landmark, Welcome to the</text>
    <text x="497.3333333333333" y="720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#D9DEEE">voicecap demo, heading, level 1”</text>
  </g>

  <g>
    <rect x="794.6666666666666" y="670" width="341.3333333333333" height="66" rx="12" fill="#151C39" stroke="#2F3A64" stroke-width="1.5"/>
    <rect x="810.6666666666666" y="687" width="52" height="30" rx="6" fill="#1E2649" stroke="#2F3A64" stroke-width="1.5"/>
    <text x="836.6666666666666" y="707" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#F4B53F">Tab</text>
    <text x="878.6666666666666" y="698" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#D9DEEE">“Skip to main content, same</text>
    <text x="878.6666666666666" y="720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#D9DEEE">page, link”</text>
  </g>
</svg>
