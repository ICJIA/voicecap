<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="When to run voicecap: run it on the deployed site before it goes live, and again after a major update, not during development. Four stages: in development, not here; before launch, run voicecap on the deployed site; live, share the results; after a major update, run it again and compare.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#181F3A"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2649"/>
      <stop offset="1" stop-color="#141A34"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" rx="20" fill="url(#bg)"/>

  <text x="66" y="76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#6E7AA0">WHEN TO RUN VOICECAP</text>
  <text x="64" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#F4F2EC">Run it before the site goes live</text>
  <rect x="66" y="140" width="66" height="5" rx="2.5" fill="#F4B53F"/>
  <text x="65" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#BBC2D8">And again after a major update. Screen reader users hear the deployed site, so that's the one to listen to.</text>

  <g opacity="0.78">
    <rect x="64" y="214" width="247" height="164" rx="16" fill="#12172E" stroke="#2F3A64" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="86" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#AEB5CF">In development</text>
    <rect x="86" y="276" width="131.2" height="32" rx="16" fill="#1E2649" fill-opacity="1"/>
    <text x="151.6" y="297" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8B93B3">✕  Not here</text>
    <text x="86" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">Builds change daily, and</text>
    <text x="86" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">aren't what users get.</text>
  </g>

  <g>
    <rect x="339" y="214" width="247" height="164" rx="16" fill="url(#card)" stroke="#F4B53F" stroke-width="2.5"/>
    <text x="361" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F2EC">Before launch</text>
    <rect x="361" y="276" width="168" height="32" rx="16" fill="#F4B53F" fill-opacity="1"/>
    <text x="445" y="297" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141A34">✓  Run voicecap</text>
    <text x="361" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">The deployed site, as</text>
    <text x="361" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">users will get it.</text>
  </g>

  <g>
    <rect x="614" y="214" width="247" height="164" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <text x="636" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F2EC">Live</text>
    <rect x="636" y="276" width="186.39999999999998" height="32" rx="16" fill="#1E2649" fill-opacity="1"/>
    <text x="729.2" y="297" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#D9DEEE">Share the results</text>
    <text x="636" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">The report, and the</text>
    <text x="636" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">sealed record behind it.</text>
  </g>

  <g>
    <rect x="889" y="214" width="247" height="164" rx="16" fill="url(#card)" stroke="#2F3A64" stroke-width="1.5"/>
    <text x="911" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F4F2EC">After a major update</text>
    <rect x="911" y="276" width="168" height="32" rx="16" fill="#F4B53F" fill-opacity="0.16" stroke="#F4B53F" stroke-width="1.5"/>
    <text x="995" y="297" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F4B53F">✓  Run it again</text>
    <text x="911" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">The same pages, compared</text>
    <text x="911" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#BBC2D8">with the run before.</text>
  </g>
  <path d="M319 287 L329 296 L319 305" fill="none" stroke="#6E7AA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M594 287 L604 296 L594 305" fill="none" stroke="#6E7AA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M869 287 L879 296 L869 305" fill="none" stroke="#6E7AA0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
