<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="voicecap — captures what a screen reader user actually hears on your website">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#181F3A"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#F4B53F" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F4B53F" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#F4B53F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2649"/>
      <stop offset="1" stop-color="#141A34"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B53F" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F4B53F" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ===================== LEFT: identity ===================== -->
  <text x="82" y="148" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#6E7AA0">ICJIA &#183; OPEN-SOURCE CLI</text>

  <text x="78" y="254" font-family="Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="92" font-weight="700" letter-spacing="-3"><tspan fill="#F4F2EC">voice</tspan><tspan fill="#F4B53F">cap</tspan></text>
  <rect x="82" y="276" width="66" height="5" rx="2.5" fill="#F4B53F"/>

  <text x="83" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#BBC2D8">Captures what a screen reader user</text>
  <text x="83" y="368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="400" fill="#BBC2D8">actually hears on your website.</text>

  <!-- command chip -->
  <rect x="82" y="412" width="410" height="56" rx="12" fill="#151C39" stroke="#2F3A64" stroke-width="1.5"/>
  <text x="106" y="448" font-family="Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="23" font-weight="500"><tspan fill="#F4B53F">$</tspan><tspan dx="14" fill="#D9DEEE">npx @icjia/voicecap init</tspan></text>

  <text x="84" y="556" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#6E7AA0">NVDA &#183; VOICEOVER &#160;&#183;&#160; NODE 22+ &#160;&#183;&#160; MIT</text>

  <!-- ===================== RIGHT: a transcript ===================== -->
  <rect x="616" y="150" width="512" height="356" rx="20" fill="url(#card)" stroke="#303B66" stroke-width="1.5"/>

  <!-- header: what's in the card, and a recording dot -->
  <text x="656" y="208" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#6E7AA0">TRANSCRIPT</text>
  <circle cx="1011" cy="203" r="5" fill="#F4B53F"/>
  <text x="1092" y="208" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#6E7AA0">NVDA</text>
  <line x1="640" y1="224" x2="1104" y2="224" stroke="#303B66" stroke-width="1"/>

  <!-- rows: what the screen reader said, and the pass that heard it -->
  <g font-family="Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#C4CADE">
    <text x="656" y="266">Main, landmark</text>
    <text x="656" y="308">Grants, heading level 1</text>
    <text x="656" y="350">Search, edit text</text>
    <text x="656" y="392">Menu, button, collapsed</text>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#F4B53F" fill-opacity="0.85" text-anchor="end">
    <text x="1092" y="264">READ</text>
    <text x="1092" y="306">HEADINGS</text>
    <text x="1092" y="348">TAB</text>
    <text x="1092" y="390">TAB</text>
  </g>

  <!-- voice: a waveform where pagecount has its total -->
  <line x1="640" y1="418" x2="1104" y2="418" stroke="#3C4878" stroke-width="1.5"/>
  <g fill="url(#wave)">
    <rect x="656" y="452" width="6" height="16" rx="3"/>
    <rect x="670" y="444" width="6" height="32" rx="3"/>
    <rect x="684" y="436" width="6" height="48" rx="3"/>
    <rect x="698" y="446" width="6" height="28" rx="3"/>
    <rect x="712" y="440" width="6" height="40" rx="3"/>
    <rect x="726" y="450" width="6" height="20" rx="3"/>
    <rect x="740" y="438" width="6" height="44" rx="3"/>
    <rect x="754" y="432" width="6" height="56" rx="3"/>
    <rect x="768" y="442" width="6" height="36" rx="3"/>
    <rect x="782" y="448" width="6" height="24" rx="3"/>
    <rect x="796" y="440" width="6" height="40" rx="3"/>
    <rect x="810" y="452" width="6" height="16" rx="3"/>
    <rect x="824" y="444" width="6" height="32" rx="3"/>
    <rect x="838" y="436" width="6" height="48" rx="3"/>
    <rect x="852" y="446" width="6" height="28" rx="3"/>
    <rect x="866" y="454" width="6" height="12" rx="3"/>
    <rect x="880" y="442" width="6" height="36" rx="3"/>
    <rect x="894" y="434" width="6" height="52" rx="3"/>
    <rect x="908" y="444" width="6" height="32" rx="3"/>
    <rect x="922" y="450" width="6" height="20" rx="3"/>
    <rect x="936" y="440" width="6" height="40" rx="3"/>
    <rect x="950" y="446" width="6" height="28" rx="3"/>
    <rect x="964" y="454" width="6" height="12" rx="3"/>
    <rect x="978" y="448" width="6" height="24" rx="3"/>
    <rect x="992" y="452" width="6" height="16" rx="3"/>
    <rect x="1006" y="456" width="6" height="8" rx="3"/>
  </g>
  <text x="1092" y="466" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#8A93B4">saved</text>
</svg>
