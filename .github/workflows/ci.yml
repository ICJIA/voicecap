name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      # Each action is pinned to the commit its tag named when it was last updated, with that tag in
      # the comment beside it, so a tag that moves can't change what runs here. Dependabot proposes
      # the updates (.github/dependabot.yml).

      # The whole history, not the newest commit alone: test/release-facts.test.ts records the
      # release's facts from this checkout, and a shallow clone can't count the commits behind it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory in a package that voicecap's own package installs.
      - run: pnpm audit --prod --audit-level high

      # The report's accessibility test runs axe in real Chromium (contrast needs rendering).
      - name: Install Chromium (Linux, with system libraries)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - run: pnpm lint
      - run: pnpm typecheck
      # Set as a person's would be, so that test/environment.test.ts checks here too that test/setup.ts
      # keeps every test from seeing them.
      - run: pnpm test
        env:
          VOICECAP_TRANSCRIPTS: never-a-test-home
          VOICECAP_REVIEWER: never-a-test-reviewer
          VOICECAP_CONFIG: never-a-test-config
      - run: pnpm build

      - name: Smoke test the CLI with the replay driver
        shell: bash
        run: |
          out="$RUNNER_TEMP/transcripts"
          node dist/cli.js --site http://127.0.0.1:4747 --pages fixture/pages.json \
            --replay-from fixture/replay-run --out "$out"
          test -f "$out/127.0.0.1_4747/report.html"
          test -f "$out/127.0.0.1_4747/latest.txt"
          test -f "$out/127.0.0.1_4747/share/current.html"
          grep -q "data:font/woff2" "$out/127.0.0.1_4747/share/current.html"
          test -f "$out/127.0.0.1_4747/share/current.docx"
          node dist/cli.js verify --out "$out"
          node dist/cli.js walkthrough --out "$out" --site http://127.0.0.1:4747 "$RUNNER_TEMP/walkthrough.json"
          node dist/cli.js --walkthrough "$RUNNER_TEMP/walkthrough.json" --replay-from fixture/replay-run --out "$out" | tee repeat.txt
          grep -q "^3 of 3 pages sound the same\." repeat.txt
          home="$RUNNER_TEMP/site-home"
          cp -R test/fixtures/share/demo-2026-09-29 "$home"
          # The demo's runs read it at an IP address and recorded no canonical address, and voicecap
          # won't share a site by one: a config in a folder of the demo's own names it, as the README
          # says to, and the share is run from there.
          named="$RUNNER_TEMP/demo-share"
          mkdir -p "$named"
          printf '%s\n' '{ "report": { "canonical": "https://voicecap.icjia.app/demo-site/" } }' > "$named/voicecap.config.json"
          cli="$PWD/dist/cli.js"
          (cd "$named" && node "$cli" share --out "$home" --reviewer CI)
          ls "$home/127.0.0.1_4848/share" | grep '^voicecap\.icjia\.app_[0-9-]*\.html$' > /dev/null
          node dist/cli.js site --home "$home" --out "$home/_site"
          test -f "$home/_site/index.html"
          grep -q "^/index.html$" "$home/_site/_headers"
          node dist/cli.js verify --out "$home"

      # Git Bash turns "/about" into "C:/Program Files/Git/about"; voicecap must explain that.
      - name: Git Bash path rewriting is detected and explained
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out="$RUNNER_TEMP/transcripts"
          set +e
          node dist/cli.js review --page /flawed/ --status reviewed --reviewer CI --out "$out" 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 1
          grep -q "Git Bash rewrote it" err.txt
          grep -q "MSYS_NO_PATHCONV=1" err.txt
          MSYS_NO_PATHCONV=1 node dist/cli.js review --page /flawed/ --status reviewed --reviewer CI --out "$out"
